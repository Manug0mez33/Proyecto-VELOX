# Blueprint de Render: crea la base PostgreSQL y el servicio web del backend VELOX.
# Render > New > Blueprint > elegir este repositorio.
services:
  - type: web
    name: velox-backend
    runtime: docker
    plan: free
    region: virginia
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: velox-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      # URL del frontend en producción (ej. https://velox.vercel.app); Render la pide al crear el Blueprint.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

databases:
  - name: velox-db
    plan: free
    region: virginia
    databaseName: velox
    user: velox
