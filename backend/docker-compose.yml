# Entorno de desarrollo local: recarga automática con runserver y código montado como volumen.
# Producción (Render) usa el CMD del Dockerfile (start.sh con gunicorn).
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: velox_backend_api
    ports:
      - "8000:8000"
    env_file:
      - ./.env.example
    volumes:
      - .:/app
      # Evita que el .venv del host pise el del contenedor.
      - /app/.venv
    command: >
      sh -c "python src/manage.py migrate &&
             python src/manage.py cargar_catalogo &&
             python src/manage.py runserver 0.0.0.0:8000"
